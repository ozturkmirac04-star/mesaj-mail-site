<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Mesaj Paneli</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0b0f19;
      color: white;
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .box {
      width: min(400px,100%);
      padding: 25px;

      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 10px;

      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;

      color: white;
      outline: none;
    }

    button {
      padding: 12px 16px;
      margin-top: 12px;

      border: 0;
      border-radius: 12px;

      background: #6ee7ff;
      color: #071018;

      font-weight: 700;
      cursor: pointer;
    }

    .error {
      color: #ff8585;
      margin-top: 10px;
    }

    .panel {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 320px;
      border-right: 1px solid rgba(255,255,255,.12);
      overflow-y: auto;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .top {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .list-item {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      cursor: pointer;
    }

    .list-item:hover {
      background: rgba(255,255,255,.05);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 11px 14px;
      border-radius: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .visitor {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
    }

    .admin {
      align-self: flex-end;
      background: rgba(110,231,255,.16);
    }

    .composer {
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,.12);
      display: flex;
      gap: 10px;
    }

    .composer textarea {
      margin: 0;
      resize: none;
      min-height: 50px;
    }

    @media(max-width:700px) {

      .panel {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 35vh;
      }

      .chat {
        height: 65vh;
      }
    }
  </style>
</head>

<body>

<div id="login" class="login">

  <div class="box">

    <h2>🔐 Mesaj Paneli</h2>

    <p>
      Yönetici şifreni gir.
    </p>

    <input
      id="password"
      type="password"
      placeholder="Admin şifresi"
    >

    <button onclick="login()">
      Giriş Yap
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<div id="panel" class="panel">

  <aside class="sidebar">

    <div class="top">
      <strong>💬 Sohbetler</strong>

      <button onclick="logout()">
        Çıkış
      </button>
    </div>

    <div id="chatList"></div>

  </aside>


  <main class="chat">

    <div class="top">

      <strong id="chatTitle">
        Bir sohbet seç
      </strong>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="composer">

      <textarea
        id="reply"
        maxlength="1000"
        placeholder="Cevabını yaz..."
      ></textarea>

      <button onclick="sendReply()">
        Gönder
      </button>

    </div>

  </main>

</div>


<script>

let currentChat = null;


async function login() {

  const password =
    document.getElementById(
      "password"
    ).value;

  const response =
    await fetch(
      "/api/admin/login",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          password
        })
      }
    );

  if (!response.ok) {

    document.getElementById(
      "loginError"
    ).textContent =
      "Şifre yanlış.";

    return;
  }

  document.getElementById(
    "login"
  ).style.display = "none";

  document.getElementById(
    "panel"
  ).style.display = "flex";

  loadChats();
}


async function loadChats() {

  const response =
    await fetch(
      "/api/admin/chats"
    );

  if (!response.ok) {
    return;
  }

  const data =
    await response.json();

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  data.chats.forEach(chat => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "list-item";

    item.innerHTML =
      `
        <strong>#${chat.public_code}</strong>
        <br>
        <small>
          ${chat.message_count} mesaj
        </small>
      `;

    item.onclick =
      () => openChat(chat.id, chat.public_code);

    list.appendChild(item);

  });
}


async function openChat(id, code) {

  currentChat = id;

  document.getElementById(
    "chatTitle"
  ).textContent =
    "#" + code;

  await loadMessages();

}


async function loadMessages() {

  if (!currentChat) return;

  const response =
    await fetch(
      "/api/admin/chat/" +
      encodeURIComponent(
        currentChat
      )
    );

  if (!response.ok) return;

  const data =
    await response.json();

  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML = "";

  data.messages.forEach(message => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "message " +
      (
        message.sender === "admin"
          ? "admin"
          : "visitor"
      );

    div.textContent =
      message.text;

    container.appendChild(div);

  });

  container.scrollTop =
    container.scrollHeight;
}


async function sendReply() {

  if (!currentChat) {

    alert(
      "Önce bir sohbet seç."
    );

    return;
  }

  const input =
    document.getElementById(
      "reply"
    );

  const text =
    input.value.trim();

  if (!text) return;

  const response =
    await fetch(
      "/api/admin/chat/" +
      encodeURIComponent(
        currentChat
      ) +
      "/message",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          text
        })
      }
    );

  if (!response.ok) {

    alert(
      "Mesaj gönderilemedi."
    );

    return;
  }

  input.value = "";

  await loadMessages();

  await loadChats();

}


async function logout() {

  await fetch(
    "/api/admin/logout",
    {
      method: "POST"
    }
  );

  location.reload();

}

</script>

</body>
</html>
