<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mesajlaşma</title>

  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.60);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          1000px 600px at 15% 10%,
          rgba(110,231,255,.16),
          transparent 55%
        ),
        radial-gradient(
          800px 500px at 85% 20%,
          rgba(167,139,250,.16),
          transparent 50%
        ),
        var(--bg);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(650px, 100%);
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(15px);
    }

    .header {
      padding: 22px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 7px;
      font-size: 26px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .messages {
      height: 430px;
      overflow-y: auto;
      padding: 18px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 15px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .visitor {
      align-self: flex-end;
      background: rgba(110,231,255,.16);
      border: 1px solid rgba(110,231,255,.20);
    }

    .admin {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .time {
      margin-top: 4px;
      font-size: 10px;
      opacity: .5;
    }

    .composer {
      padding: 15px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 130px;

      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);

      border-radius: 14px;
      padding: 13px;

      outline: none;
      font-size: 14px;
    }

    button {
      border: 1px solid rgba(110,231,255,.3);
      background: rgba(110,231,255,.15);
      color: white;

      border-radius: 14px;
      padding: 0 18px;

      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .info {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .code {
      color: white;
      font-weight: 700;
    }

    .error {
      color: #ff8b8b;
      padding: 12px 18px;
      display: none;
      font-size: 13px;
    }

    @media(max-width:600px) {
      .messages {
        height: 55vh;
      }

      .message {
        max-width: 90%;
      }

      .composer {
        align-items: stretch;
      }

      button {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">
      <h1>💬 Mesajlaşma</h1>

      <p class="sub">
        Buradan direkt mesajlaşabiliriz.
      </p>
    </div>

    <div id="messages" class="messages">
    </div>

    <div id="error" class="error">
    </div>

    <div class="composer">

      <textarea
        id="messageInput"
        maxlength="1000"
        placeholder="Mesajını yaz..."
      ></textarea>

      <button id="sendButton">
        Gönder
      </button>

    </div>

    <div class="info">

      Sohbet kodun:
      <span id="chatCode" class="code">yükleniyor...</span>

      <br>

      Bu kodu kaybetme. Sohbetine tekrar girmek için gerekli.

    </div>

  </div>

</div>


<script>

const messagesEl = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const chatCodeEl = document.getElementById("chatCode");
const errorEl = document.getElementById("error");


let chatId = null;


function showError(message) {

  errorEl.textContent = message;
  errorEl.style.display = "block";

}


function hideError() {

  errorEl.style.display = "none";

}


function addMessage(message) {

  const wrapper = document.createElement("div");

  wrapper.className =
    "message " +
    (message.sender === "visitor"
      ? "visitor"
      : "admin");


  const text = document.createElement("div");

  text.textContent = message.text;


  const time = document.createElement("div");

  time.className = "time";

  time.textContent =
    new Date(message.created_at)
      .toLocaleString("tr-TR");


  wrapper.appendChild(text);
  wrapper.appendChild(time);

  messagesEl.appendChild(wrapper);

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


async function createChat() {

  try {

    const response =
      await fetch("/api/chat/create", {
        method: "POST"
      });


    if (!response.ok) {

      throw new Error(
        "Sohbet oluşturulamadı."
      );

    }


    const data =
      await response.json();


    chatId = data.chatId;

    chatCodeEl.textContent =
      data.code;


    localStorage.setItem(
      "chatId",
      chatId
    );


    await loadMessages();

  } catch(error) {

    showError(error.message);

  }

}


async function loadMessages() {

  if (!chatId) return;


  try {

    const response =
      await fetch(
        "/api/chat/" +
        encodeURIComponent(chatId)
      );


    if (!response.ok) {

      throw new Error(
        "Mesajlar alınamadı."
      );

    }


    const data =
      await response.json();


    messagesEl.innerHTML = "";

    data.messages.forEach(
      addMessage
    );


  } catch(error) {

    showError(error.message);

  }

}


async function sendMessage() {

  hideError();


  const text =
    input.value.trim();


  if (!text) return;


  sendButton.disabled = true;


  try {

    const response =
      await fetch(
        "/api/chat/" +
        encodeURIComponent(chatId) +
        "/message",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            text
          })
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        error ||
        "Mesaj gönderilemedi."
      );

    }


    input.value = "";

    await loadMessages();


  } catch(error) {

    showError(error.message);

  } finally {

    sendButton.disabled = false;

    input.focus();

  }

}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


async function start() {

  const savedChat =
    localStorage.getItem(
      "chatId"
    );


  if (savedChat) {

    chatId = savedChat;

    await loadMessages();

    try {

      const response =
        await fetch(
          "/api/chat/" +
          encodeURIComponent(chatId) +
          "/info"
        );


      if (response.ok) {

        const data =
          await response.json();

        chatCodeEl.textContent =
          data.code;

      }

    } catch {}

  } else {

    await createChat();

  }

}


start();

</script>

</body>
</html>
